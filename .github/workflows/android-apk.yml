# 폰에 바로 깔아 볼 수 있는 Android 설치 파일(APK)을 만든다.
# Actions 탭 > 실행 기록 > 아래 Artifacts에서 받는다.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      # 테스트용이라 디버그 키로 서명한다. 스토어용 서명은 출시 준비 때 따로 만든다.
      - run: flutter build apk --release --dart-define=APP_CHECK_DEBUG_TOKEN=${{ secrets.APP_CHECK_DEBUG_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: oneul-ppopgi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
